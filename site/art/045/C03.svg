<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Two people trade: a coin travels from one to the other and a cup of coffee comes back, and a plus sign rises above each of them. Above, drawn in dashes, a pie split in two.">
  <rect class="s" x="0" y="248" width="400" height="52"/>
  <!-- the imagined world: a fixed pie, every slice I take is one you can't have -->
  <g class="ks" style="stroke-width:3;stroke-dasharray:6 6">
    <circle cx="200" cy="54" r="30"/>
    <path d="M200 24v60"/>
  </g>
  <!-- buyer, facing right; seller, facing left -->
  <use class="b" href="#fig-r" x="88" y="113" width="46" height="135"/>
  <g transform="translate(400 0) scale(-1 1)"><use class="r" href="#fig-r" x="88" y="113" width="46" height="135"/></g>
  <!-- the exchange: a coin goes one way, a cup of coffee the other -->
  <g class="ks" style="stroke-width:4.2">
    <path d="M146 166c18-38 90-38 108 0"/>
    <path d="M254 194c-18 38-90 38-108 0"/>
  </g>
  <g class="k">
    <path d="M262 174.6l-17.6-2 9.6-12.4z"/>
    <path d="M138 185.4l17.6 2-9.6 12.4z"/>
  </g>
  <use class="y" href="#coin" x="182" y="119" width="36" height="36"/>
  <g class="r">
    <path d="M184.6 207h27l-3.4 24.4h-20.2z"/>
    <path d="M211.2 210.6h4.2a6.2 6.2 0 0 1 0 12.4h-6.2l.8-4.4h5.2a1.8 1.8 0 0 0 0-3.6h-4.8z"/>
  </g>
  <g class="ks" style="stroke-width:2.6"><path d="M193 201c-2.6-3.4 2.6-5.6 0-9.4M202.6 201c-2.6-3.4 2.6-5.6 0-9.4"/></g>
  <!-- and both walk away better off -->
  <circle class="y" cx="111" cy="86" r="17"/>
  <circle class="y" cx="289" cy="86" r="17"/>
  <g class="k">
    <rect x="102" y="83.4" width="18" height="5.2" rx="1.4"/><rect x="108.4" y="77" width="5.2" height="18" rx="1.4"/>
    <rect x="280" y="83.4" width="18" height="5.2" rx="1.4"/><rect x="286.4" y="77" width="5.2" height="18" rx="1.4"/>
  </g>
</svg>
