<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The newsreel · Everything is Everything</title>
  <meta name="description" content="The show’s ideas, stories, books and laughs, one after another, each at the moment Amit Varma or Ajay Shah said it.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Everything is Everything">
  <meta property="og:title" content="The newsreel: Everything is Everything, a moment at a time">
  <meta property="og:description" content="The show’s ideas, stories, books and laughs, one after another, each at the moment it was said.">
  <meta property="og:image" content="https://eie.taptappers.club/45/media/two-shot.jpg">
  <meta property="og:url" content="https://eie.taptappers.club/reels/">
  <link rel="canonical" href="https://eie.taptappers.club/reels/">
  <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 22'%3E%3Ccircle cx='11' cy='11' r='10' fill='%23D4522F'/%3E%3Ccircle cx='23' cy='11' r='10' fill='%232B5BA6' fill-opacity='.85'/%3E%3C/svg%3E">
  <!-- the player's hosts, met before the first swipe needs them -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preload" href="../paper/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../paper/fonts/newsreader-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../paper/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="reels.css">
</head>
<body>
  <header class="bar" id="bar">
    <a class="back" href="../" id="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span><span class="long">The paper</span><span class="short">Paper</span></span></a>
    <button class="which" type="button" id="which" aria-haspopup="dialog" aria-controls="sheet">
      <span class="name" id="name">The newsreel</span><span class="where t" id="where" aria-hidden="true"></span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
  </header>

  <main id="feed" aria-label="The newsreel">
    <div class="track" id="track">
      <div class="list" id="list" role="feed" aria-busy="true" aria-labelledby="name"></div>
      <div class="films" id="films"></div>
    </div>
  </main>

  <nav class="ctl" id="ctl" aria-label="Playback">
    <button type="button" class="prev" id="prev" aria-label="Previous moment" aria-keyshortcuts="ArrowUp k"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="sound" type="button" id="sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="on" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/><path class="off" d="M16 9.5l5 5m0-5l-5 5"/></svg>
      <span class="label">Sound</span>
    </button>
    <button type="button" class="play" id="play" aria-label="Pause" aria-keyshortcuts="Space"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="pause" d="M8 5.5v13M16 5.5v13"/><path class="go" d="M7.5 5.2v13.6L19 12z"/><path class="again" d="M5.5 12a6.5 6.5 0 106.5-6.5H8.5M11 2.5l-3 3 3 3"/></svg></button>
    <button type="button" class="more" id="more" hidden>Keep listening</button>
    <button type="button" class="share" id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M7.5 8L12 3.5 16.5 8M5 12.5v6.5h14v-6.5"/></svg><span>Share</span></button>
    <button type="button" class="next" id="next" aria-label="Next moment" aria-keyshortcuts="ArrowDown j"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </nav>

  <p class="keys" aria-hidden="true"><kbd>↑</kbd> <kbd>↓</kbd> to move · <kbd>Space</kbd> to pause · <kbd>M</kbd> for sound</p>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" hidden>
    <div class="sheet-card" id="sheet-card" tabindex="-1"></div>
  </div>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  <noscript><p class="nojs">The newsreel plays the show’s moments one after another, and needs JavaScript. <a href="../">The paper</a> works without it.</p></noscript>
  <script type="module" src="reels.js"></script>
</body>
</html>
